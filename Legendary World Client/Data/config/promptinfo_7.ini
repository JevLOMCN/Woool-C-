拜师=0/<color=white 拜师:>$新手要想熟悉游戏，最快的方式就是找寻一个合适的师傅。\    <color=blue 方式一：>直接找寻合适的师傅，点击头像，选择“请求拜师”。\    <color=blue 方式二：>和合适的师傅去中州武官内找寻<武馆教头/@@goto SH003 武馆教头 19,19>\    <color=blue 方式三：>在中州点击英雄招募榜点击师徒页签，申请拜师。
新手阶段=1/<color=white 新手阶段：>$    新手任务是帮助新手快速升级的任务，任何新人第一次上线时都会自动领取到新手任务。\    新手任务包括：屠夫的刀子、鱼人的阴谋、雪中送炭、消失的戒指、求婚的勇气、王都送信、武\官之心、史官的愤怒和夺回地魂灵石等\    在新手任务中可以获得道具、金币、声望、经验、炼狱体验卡、双倍经验卡等奖励。
天人境界=2/<color=white 天人境界：>$    天人境界是本体及分身通过飞升成功达到的境界。\    <color=blue 天人境界作用：>1.全新封号和翅膀。\                  2.突破技能专家级的限制，可提升技能到大师、宗师、权威、王者。\                  3.属性全面提高，更可获得神元力、魔元力。
天人99重=3/<color=white 天人境界天人99重：>$<color=blue 飞仙方法：>1、天人99重经验达到100%之后可与青霄天界（332，360）的仙池幻境守卫进入“天仙池”。\          2、在天仙池战胜代表“喜，怒，哀，乐，爱，恶，欲”七情的妖兽，并战胜青宵天界最终\             守卫者“七情天仙”可成为天仙。
宗族争夺战=4/<color=white 宗族争夺战:>$    每周日20:00前，由族长在中州药店掌柜或炼狱流浪商人处报名参加商户争夺战，有宗族的玩家\即可进入指定地图。\<color=blue 获胜条件：>争夺战中率先保留“宗族秘宝”超过一定时间，或在争夺战结束之时(20:00)拥有“宗族\          秘宝”的宗族将获得此商户未来一周内的税收权。
创建(加入)宗族=5/<color=white 创建(加入)宗族:>$<color=blue 创建宗族：>40级以上角色可在“幻神殿”或“赤魔殿”内找寻宗族使者处交纳1个灵皓石和1个金砖，即\          可开创宗族。\<color=blue 加入宗族：>在英雄旗帜处点击加入即可申请加入选定的宗族，待宗族宗主同意加入后即可。
28级真元期=6/<color=white 真元期:>$    真元期可在中州客栈玄玄老人处（519，261）接取修真主线任务－踏上修真之路、开启元气。\    真元期完成修真任务可获得真元诀技能书与元气槽。
65级起渡劫期=7/<color=white 渡劫期:>$    65级以上角色在中州老兵（468，226）处前往神殿或魔殿，从神殿执事或者魔殿执事处炼制金莲\(魔莲)在空旷处释放出金莲(魔莲)，注入灵力启动飞升台。\    启动后，点击飞升台，根据飞升提示时间，踏上飞升台，开始渡劫，可请同伴协助飞升。\飞升时，使用灵皓石，点击莲花台旁边的NPC可召唤出不动神将帮助自己抵御天劫。
