分神期=12/<color=white 分神期：>$    分神是指元神再化元神，获得第二元神。\    <color=blue 第二元神分神需要：>拥有元婴，本体达到48级、元神达到46级。\    <color=blue 第二元神分神方法：>在灵台仙境完成神威狱挑战后，回到灵台仙人处分神
天元心法二十重=13/<color=white 天元心法二十重:>$    天元心法20重是天元心法的一个阶段，达到天元心法20重，内敛元神可飞出本体，与外现元神融合。\    天元心法通过使用"天元石"提升天元值来升级，天元值达到升级要求，天元心法就会升级。
攻打(防守)沙城=14/<color=white 攻打(防守)沙城：>$    行会老大在中州皇宫国王处使用游戏200万、魔神雕像、行会经验1千万即可申请攻沙。\攻城时间可与跃马平原的孤独老人对话了解。
行会通灵塔=15/<color=white 行会通灵塔:>$    通灵塔是行会领取福利、获得属性加成、行会任务的新系统新建筑。\    <color=blue 建塔方法：>所有行会会长均可打开江湖人脉，申请建造行会通灵塔。\    <color=blue 通灵塔作用：>1.使用行会银两可在通灵塔珍宝阁中开启宝物。2.全体行会成员获得属性加成(灵\                塔层级越高，加成越高)。    3.行会特有标志。    4.行会全新官职。
元婴期=16/<color=white 元婴期：>$    元婴期指获得并修炼元婴的阶段。拥有元婴可提高本体攻击、魔法、道术、防御、魔防各方面属性\    <color=blue 获得元婴的方法：>1.新手任务最后一步承接到修真任务，完成修真任务可以获得。\                    2.如果做过新手任务，可去国王处接修真任务，完成后可以获得。\                    3.已有元神角色，可去玄玄老人处通过“发现元婴”获得；   
分身期=17/<color=white 分元神：>$<color=blue 获得元神方法：>1.当本体等级达到46级并完成修行之路任务后，可以在中州客栈玄玄老人处领取元神；\              2.拥有星辰精华，可以直接在中州客栈玄玄老人处领取元神；
领悟天元心法=18/<color=white 领悟天元心法：>$    任何勇士都可前往中州魔法阵祭祀（428，174）处学习天元心法。\    <color=blue 领悟条件：>必须已获得元神，且携元神一同前往。
内外切换=19/<color=white 内外切换：>$    学习了天元心法，并且达到天元心法一重即可使用快捷键ALT+F1随意切换内外元神。
主元切换=20/<color=white 主元切换：>$    学习了天元心法，并且达到天元心法一重即可按ALT+F2可切换主体与元神。
天绝魔域=21/<color=white 天绝魔域：>$<color=blue 天绝魔域流程：>1.行会会长打开通灵塔界面，进入“仙灵碑”，自行挑选进入天绝魔域的行会成员发\                出动员令。\              2.被选中的行会成员进入仙灵碑界面报道。\              3.会长可在仙灵碑界面评估行会实力，全体成员可在通道开启时间内进入天绝魔域。
出师=22/<color=white 出师：>$   徒弟在27级前（包括27级）可以拜师，当达到35级即可出师，出师后徒弟可以获得12点声望。
心魔=23/<color=white 心魔：>$    心魔是人形怪物，心魔由分身而产生；\    心魔击败后用玉净瓶抓获，心魔在任何地图出现。
神威狱=24/<color=white 神威狱：>$    神威狱中囚禁了大量的心魔。\    通过中州<老兵/@@goto 0 老兵 468,226>或中州<魔法阵祭祀/@@goto 0 魔法阵祭祀 431,172>可传送到神威狱。\    在神威狱中，可参加神龙献宝、挑战BOSS无相天魔、挖掘天魔宝藏等活动。
黑暗附魔=25/<color=blue 黑暗附魔>$    黑暗魔力达到200点，可以在中州<铸造师/@@goto 0 铸造师 422,248>处升级武器。\    黑暗魔力通过附魔或使用镇魔符增加。


