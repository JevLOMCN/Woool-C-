[TigerSkillDiff9]
0=猛击/有概率对进攻的目标发动冲撞攻击，并且目标击退3格。/40级可升级技能至中级_40/70级可升级技能至高级_70/90级可升级技能至专家_90
1=怒嚎/有概率对进攻的目标发动3*3的怒嚎攻击，并有概率将目标从灵兽上打落。/40级可升级技能至中级_40/70级可升级技能至高级_70/90级可升级技能至专家_90
2=冲撞/有概率对进攻的目标发动冲撞攻击，并且目标击退3格。/40级可升级技能至中级_40/70级可升级技能至高级_70/90级可升级技能至专家_90
3=斗转/当主体受到伤害时，部分伤害值将转移到虎王身上，虎王等级越高，可转移的伤害值比例就越高。/40级可升级技能至中级_40/70级可升级技能至高级_70/90级可升级技能至专家_90
4=护主/当主体受到伤害濒临死亡时，虎王有概率替主体抵挡受到的攻击，并且帮助主体血量瞬间恢复到总血量的50%，同时虎王死亡。/60级可升级技能至中级_60/80级可升级技能至高级_80/100级可升级技能至专家_100
5=冲击波/当虎王受到巨大伤害时，触发此技能，以自身为中心发动9*9的范围攻击。/60级可升级技能至中级_60/80级可升级技能至高级_80/100级可升级技能至专家_100
6=反弹/虎王受到伤害时就有概率触发此技能，反弹对方的攻击伤害，等级越高可反弹的攻击值也越高，触发概率也越高。/60级可升级技能至中级_60/80级可升级技能至高级_80/100级可升级技能至专家_100
7=转换/当主体的血量过低时，虎王有概率将自己的当前生命值按比例转换给玩家本体。等级越高转换比例越高。/60级可升级技能至中级_60/80级可升级技能至高级_80/100级可升级技能至专家_100
8=嗜血/当虎王血量每降低10%时，有概率将攻击方的血吸收为自己的生命值。等级越高触发概率和嗜血比例就越高。/60级可升级技能至中级_60/80级可升级技能至高级_80/100级可升级技能至专家_100
9=流金/虎王五行属性转变为金，且增加虎王五行属性，等级越高，增加的五行属性越高。/20级可升级技能至中级_20/50级可升级技能至高级_50/80级可升级技能至专家_80
10=幽木/虎王五行属性转变为木，且增加虎王五行属性，等级越高，增加的五行属性越高。/20级可升级技能至中级_20/50级可升级技能至高级_50/80级可升级技能至专家_80
12=御水/虎王五行属性转变为水，且增加虎王五行属性，等级越高，增加的五行属性越高。/20级可升级技能至中级_20/50级可升级技能至高级_50/80级可升级技能至专家_80
13=吞火/虎王五行属性转变为火，且增加虎王五行属性，等级越高，增加的五行属性越高。/20级可升级技能至中级_20/50级可升级技能至高级_50/80级可升级技能至专家_80
