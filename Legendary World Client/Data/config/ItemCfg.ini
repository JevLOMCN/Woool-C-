[MeridTips]
0=真丹绝技：每次攻击一定概率无视对手防御和魔法防御。
1=神意绝技：每次被攻击受到伤害大于等于自身生命上限50%时，下一次被攻击伤害有一定的减免。
2=法象绝技：增加自身一定比例的免伤。
3=通玄绝技：增加自身一定的暴击率。
4=永生绝技：进一步提升冲脉神通的效果，提高无视对手防御和魔法防御的概率。
5=不死绝技：每次被攻击一定几率获得免伤所有伤害50%的状态，持续10秒钟。
6=未激活，真丹境界全部打通后可使用真丹绝技道具激活，激活后可以获得特殊效果：攻击有一定概率无视对方防御和魔法防御。
7=未激活，神意境界全部打通后，可以使用神意绝技道具激活，激活后可以一定概率受伤超过50%后下一次受伤减免50%。
8=未激活，法象境界全部打通后，可以使用法象绝技道具激活，可以获得一定的免伤，减少自身受到其他玩家的一定比例的伤害。
9=未激活，通玄境界全部打通后使用通玄绝技道具可激活，提高自身一定爆击几率。
10=未激活，永生境界打通后，使用永生绝技道具可激活，进一步提升真丹绝技的效果。
11=未激活，不死境界全部打通后，可以激活不死绝技效果，被攻击一定几率获得免伤状态。

